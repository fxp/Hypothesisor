<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hypothesisor</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1 data-i18n="extName">Hypothesisor</h1>
    <div class="header-tools">
      <button id="langToggle" type="button" class="lang-toggle" title="Switch language">中</button>
      <a id="openOptions" href="#" data-i18n-title="popup_settings_title" title="Settings">⚙</a>
    </div>
  </header>

  <section class="target">
    <div id="pageTitle" class="muted">—</div>
    <div id="pageUrl" class="url muted"></div>
  </section>

  <section class="controls">
    <label class="control-row">
      <span class="control-label" data-i18n="popup_label_style">Focus</span>
      <select id="styleSelect" class="control-select">
        <option value=""               data-i18n="popup_style_default">🎯 全部内容（默认）</option>
        <option value="non-consensus"  data-i18n="style_non_consensus">🤔 非共识</option>
        <option value="data"           data-i18n="style_data">📊 数据</option>
        <option value="actionable"     data-i18n="style_actionable">⚡ 可执行</option>
        <option value="gold-sentences" data-i18n="style_gold_sentences">💎 金句</option>
        <option value="critique"       data-i18n="style_critique">🔍 批判</option>
        <option value="surprise"       data-i18n="style_surprise">🤯 惊喜事实</option>
        <option value="__custom__"     data-i18n="popup_style_custom">✏️ 自定义…</option>
      </select>
    </label>
    <input id="styleCustom" type="text" data-i18n-placeholder="popup_style_placeholder" placeholder="Describe your annotation preference" hidden />
    <label class="control-row">
      <span class="control-label" data-i18n="popup_label_language">Language</span>
      <select id="langSelect" class="control-select">
        <option value="zh"        data-i18n="lang_zh">中文</option>
        <option value="en"        data-i18n="lang_en">English</option>
        <option value="auto"      data-i18n="lang_auto_short">自动 · 跟随原文</option>
        <option value="bilingual" data-i18n="lang_bilingual">中英对照（约慢 2×）</option>
      </select>
    </label>
  </section>

  <div class="action-row">
    <button id="generate" class="primary action" data-i18n="popup_btn_generate">✨ Annotate this page</button>
  </div>

  <div id="status" class="status"></div>

  <section id="jobsPanel" class="jobs-panel" hidden>
    <div class="jobs-panel-label" data-i18n="jobs_recent">Jobs</div>
    <div id="jobsList" class="jobs-list"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
